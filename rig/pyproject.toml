[project]
name = "neon-rig"
version = "0.1.0"
description = "Webcam rig for measuring the neon perceptron LEDs from weddle"
readme = "README.md"
authors = [{ name = "Ben Swift", email = "ben@benswift.me" }]
requires-python = ">=3.15"
dependencies = [
  "loguru>=0.7.3",
  "numpy>=2.5.4",
  "opencv-python-headless>=5.0.0.93",
  "polars>=2.0.0",
  "pydantic>=2.14.1",
  "typer>=0.27.3",
]

[project.scripts]
neon-rig = "neon_rig:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-xdist>=3.8.0", "ruff>=0.17.2"]

[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = ["tests"]
